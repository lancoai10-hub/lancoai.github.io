<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My 60-Day Daily Schedule</title>
<style>
  :root {
    --bg:     #080d1a;
    --bg2:    #0f1729;
    --bg3:    #162035;
    --bg4:    #1c2a42;
    --border: #1e3456;
    --border2:#2a4870;
    --text:   #dce8f5;
    --text2:  #7a99be;
    --text3:  #3d5878;
    --accent: #2e86de;
    --green:  #1a9e6e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 1.25rem 1rem 4rem;
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg2);
    border-radius: 18px;
    padding: 1.75rem 1.25rem 2.5rem;
    border: 1px solid var(--border);
  }

  .header { margin-bottom: 1.5rem; }
  .page-icon { font-size: 34px; margin-bottom: 10px; display: block; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; line-height: 1.2; }
  .page-sub { font-size: 12px; color: var(--text3); margin-top: 5px; line-height: 1.5; }

  /* Calendar & Analytics Header */
  .calendar-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    background: var(--bg3);
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .cal-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px;}
  .date-input {
    background: var(--bg2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
    color-scheme: dark; /* native dark mode picker */
  }
  .date-input:focus { outline: 2px solid var(--accent); }
  
  .analytics-btn {
    background: var(--bg4); border: 1px solid var(--border2);
    color: var(--text); padding: 9px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .analytics-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(46,134,222,0.4); }

  .progress-wrap { margin-bottom: 1.25rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 7px; }
  .prog-bar { height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.35s ease; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 1.5rem;
  }
  .sc { background: var(--bg3); border-radius: 10px; padding: 10px; border: 1px solid var(--border); }
  .sc-l { font-size: 9px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .sc-v { font-size: 15px; font-weight: 600; color: var(--text); }

  .section-head {
    font-size: 10px; font-weight: 600; color: var(--text3);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin: 1.25rem 0 7px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .row {
    display: flex;
    align-items: center;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg3);
    margin-bottom: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    min-height: 54px;
  }
  .row:hover { background: var(--bg4); border-color: var(--border2); }
  .row:active { opacity: 0.75; }
  .row.done { opacity: 0.32; }
  .row.done .row-title { text-decoration: line-through; color: var(--text3); }
  
  /* Active Time Highlight */
  .row.active {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(46, 134, 222, 0.2);
    background: var(--bg4);
  }
  .row.active .row-time {
    color: var(--accent);
    font-weight: 600;
  }
  .row.active .row-title { color: #fff; }

  .row-cb {
    width: 46px; min-width: 46px;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border);
    align-self: stretch;
  }
  .row-cb-inner {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    background: transparent;
  }
  .row.done .row-cb-inner { background: var(--green); border-color: var(--green); }
  .row.done .row-cb-inner svg { opacity: 1; }
  .row-cb-inner svg { width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 2.5; opacity: 0; }

  .row-dot { width: 7px; height: 7px; border-radius: 50%; min-width: 7px; margin: 0 10px; flex-shrink: 0; }

  .row-main { flex: 1; padding: 11px 6px 11px 0; min-width: 0; }
  .row-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
  .row-time { font-size: 11px; color: var(--text3); }

  .row-end { display: flex; align-items: center; padding-right: 10px; flex-shrink: 0; }
  .row-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; }

  .bottom-bar { margin-top: 2rem; display: flex; justify-content: center; }
  .reset-btn {
    font-size: 13px;
    padding: 13px 28px;
    border-radius: 12px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    max-width: 280px;
    letter-spacing: 0.02em;
  }
  .reset-btn:hover { background: var(--bg4); color: var(--text); }
  .reset-btn:active { opacity: 0.7; }

  .footer { font-size: 11px; color: var(--text3); text-align: center; margin-top: 1.25rem; line-height: 1.7; }

  /* Modal Analytics */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8, 13, 26, 0.85); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    padding: 1rem;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; width: 100%; max-width: 500px;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .modal-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .modal-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .close-btn { background: var(--bg4); border: 1px solid var(--border); color: var(--text2); width: 30px; height: 30px; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .close-btn:hover { background: var(--border2); color: #fff; }
  
  .stat-card { background: var(--bg3); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
  .stat-card-title { font-size: 10px; text-transform: uppercase; color: var(--text2); letter-spacing: 0.05em; margin-bottom: 8px; font-weight: 600; }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--text); }
  
  .cat-row { display: flex; justify-content: space-between; font-size: 13px; margin: 10px 0 6px; color: var(--text); font-weight: 500; }
  .cat-bar-wrap { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); }
  .cat-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s ease; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 480px) {
    body { padding: 0 0 5rem; }
    .page {
      border-radius: 0;
      border-left: none;
      border-right: none;
      padding: 1.25rem 0.9rem 2rem;
      min-height: 100vh;
    }
    .calendar-wrap { padding: 12px; flex-direction: column; gap: 12px; align-items: stretch; }
    .page-title { font-size: 19px; }
    .page-sub { font-size: 11px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 1.25rem; }
    .sc { padding: 9px 10px; }
    .sc-v { font-size: 14px; }
    .row { min-height: 56px; border-radius: 8px; }
    .row-cb { width: 48px; min-width: 48px; }
    .row-title { font-size: 13px; }
    .row-time { font-size: 10px; }
    .row-tag { display: none; }
    .reset-btn { max-width: 100%; font-size: 14px; padding: 14px; }
  }

  @media (max-width: 380px) {
    .page { padding: 1rem 0.75rem 1.75rem; }
    .page-title { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <span class="page-icon">🌙</span>
    <div class="page-title">My 60-day daily schedule</div>
    <div class="page-sub">5:00 AM — 11:00 PM &nbsp;·&nbsp; Dubai &nbsp;·&nbsp; 2-month sprint</div>
  </div>

  <div class="calendar-wrap">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="cal-title">🗓️ Date:</div>
      <input type="date" id="dateInput" class="date-input">
    </div>
    <button class="analytics-btn" onclick="openAnalytics()">📊 Insights</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="pLabel">0 of 20 tasks done</span>
      <span id="pPct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="taskList"></div>

  <div class="bottom-bar">
    <button class="reset-btn" onclick="resetAll()">↺ &nbsp; Reset tasks for this date</button>
  </div>

  <div class="footer">Pick any date from the calendar to view your history<br>Tasks highlight automatically based on your current time!</div>
</div>

<!-- Analytics Modal -->
<div class="modal-overlay" id="analyticsModal" onclick="if(event.target===this)closeAnalytics()">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title">Sprint Analytics</div>
        <div class="modal-sub">Track your 60-day performance</div>
      </div>
      <button class="close-btn" onclick="closeAnalytics()">&times;</button>
    </div>
    <div id="analyticsBody"></div>
  </div>
</div>

<script>
const TASKS = [
  {time:"5:00",end:"5:45",title:"Wake up, walk & shower",cat:"body",dot:"#1D9E75",bg:"rgba(29,158,117,0.15)",tc:"#5DCAA5",section:"Morning ritual"},
  {time:"5:45",end:"6:45",title:"English speaking practice",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Morning ritual"},
  {time:"6:45",end:"7:30",title:"Breakfast + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Morning ritual"},
  {time:"7:30",end:"8:30",title:"Cybersecurity skills",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"8:30",end:"9:30",title:"Reading book",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Deep work AM"},
  {time:"9:30",end:"10:30",title:"Job applications",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"10:30",end:"11:30",title:"Interview speech practice",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"11:30",end:"13:00",title:"Lunch + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Midday reset"},
  {time:"13:00",end:"14:00",title:"YouTube channel planning",cat:"create",dot:"#D85A30",bg:"rgba(216,90,48,0.15)",tc:"#F0997B",section:"Afternoon focus"},
  {time:"14:00",end:"15:00",title:"German basics",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Afternoon focus"},
  {time:"15:00",end:"15:30",title:"Rest & nap",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Afternoon focus"},
  {time:"15:30",end:"16:30",title:"Cybersecurity practice",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Afternoon focus"},
  {time:"16:30",end:"17:30",title:"English writing + reading",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Afternoon focus"},
  {time:"17:30",end:"18:30",title:"Free time + errands",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
  {time:"18:30",end:"19:30",title:"Self-motivation + journaling",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Evening wind-down"},
  {time:"19:30",end:"20:30",title:"Dinner + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
  {time:"20:30",end:"21:30",title:"German or English review",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Evening wind-down"},
  {time:"21:30",end:"22:30",title:"Evening review + next day plan",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Evening wind-down"},
  {time:"22:30",end:"22:45",title:"Pray + meditation (15 min)",cat:"spirit",dot:"#1D9E75",bg:"rgba(29,158,117,0.15)",tc:"#5DCAA5",section:"Evening wind-down"},
  {time:"22:45",end:"23:00",title:"Wind down — no screens",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
];

let currentDateStr = '';
let history = JSON.parse(localStorage.getItem('cal_history_v1') || '{}');

function getLocalISODate() {
  const d = new Date();
  const offset = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - offset).toISOString().split('T')[0];
}

function initDate() {
  const today = getLocalISODate();
  
  const oldDataStr = localStorage.getItem('sched_v3');
  if (oldDataStr && !history[today]) {
      history[today] = JSON.parse(oldDataStr);
      localStorage.setItem('cal_history_v1', JSON.stringify(history));
  }
  
  const dateInput = document.getElementById('dateInput');
  dateInput.value = today;
  currentDateStr = today;

  dateInput.addEventListener('change', (e) => {
    currentDateStr = e.target.value;
    render();
  });

  render();
  setInterval(highlightActiveTask, 60000);
}

function getSections(){
  const s=[];
  TASKS.forEach((t,i)=>{if(i===0||t.section!==TASKS[i-1].section)s.push({name:t.section,start:i});});
  return s;
}

function render(){
  let done = history[currentDateStr] || {};
  const dc=Object.values(done).filter(Boolean).length;
  const pct=Math.round((dc/TASKS.length)*100);
  document.getElementById('pLabel').textContent=dc+' of '+TASKS.length+' tasks done';
  document.getElementById('pPct').textContent=pct+'%';
  document.getElementById('pFill').style.width=pct+'%';

  document.getElementById('stats').innerHTML=[
    {l:'Wake up',v:'5:00 AM'},
    {l:'Sleep',v:'11:00 PM'},
    {l:'Active',v:TASKS.filter(t=>t.cat!=='rest').length+' tasks'},
    {l:'Done',v:dc},
  ].map(s=>`<div class="sc"><div class="sc-l">${s.l}</div><div class="sc-v">${s.v}</div></div>`).join('');

  const secs=getSections();
  let html='';
  secs.forEach(sec=>{
    html+=`<div class="section-head">${sec.name}</div>`;
    TASKS.forEach((t,i)=>{
      const myS=[...secs].reverse().find(s=>s.start<=i);
      if(!myS||myS.name!==sec.name)return;
      const isDone=done[i];
      html+=`<div class="row${isDone?' done':''}" id="row-${i}" onclick="tog(${i})">
        <div class="row-cb"><div class="row-cb-inner"><svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></div></div>
        <div class="row-dot" style="background:${t.dot}"></div>
        <div class="row-main">
          <div class="row-title">${t.title}</div>
          <div class="row-time">${t.time} – ${t.end}</div>
        </div>
        <div class="row-end">
          <span class="row-tag" style="background:${t.bg};color:${t.tc};border:1px solid ${t.dot}55">${t.cat}</span>
        </div>
      </div>`;
    });
  });
  document.getElementById('taskList').innerHTML=html;
  
  highlightActiveTask();
}

function highlightActiveTask() {
  const isToday = (currentDateStr === getLocalISODate());
  const now = new Date();
  const currentMins = now.getHours() * 60 + now.getMinutes();

  TASKS.forEach((t, i) => {
    const rowEl = document.getElementById('row-'+i);
    if (!rowEl) return;
    rowEl.classList.remove('active');

    if (isToday) {
      const [startH, startM] = t.time.split(':').map(Number);
      const [endH, endM] = t.end.split(':').map(Number);
      let startMinsTotal = startH * 60 + startM;
      let endMinsTotal = endH * 60 + endM;
      if (endMinsTotal < startMinsTotal) endMinsTotal += 24 * 60; // spans midnight

      if (currentMins >= startMinsTotal && currentMins < endMinsTotal) {
        rowEl.classList.add('active');
      }
    }
  });
}

function tog(i){
  let done = history[currentDateStr] || {};
  done[i]=!done[i];
  history[currentDateStr] = done;
  localStorage.setItem('cal_history_v1', JSON.stringify(history));
  render();
}

function resetAll(){
  if(confirm('Reset all checkboxes for ' + currentDateStr + '?')){
    history[currentDateStr] = {};
    localStorage.setItem('cal_history_v1', JSON.stringify(history));
    render();
  }
}

// Analytics Logic
function openAnalytics() {
  document.getElementById('analyticsModal').classList.add('open');
  generateAnalytics();
}

function closeAnalytics() {
  document.getElementById('analyticsModal').classList.remove('open');
}

function generateAnalytics() {
  // Filter out days entirely empty (0 tasks) just in case
  const dates = Object.keys(history).filter(d => Object.keys(history[d]).length > 0).sort();
  
  if (dates.length === 0) {
    document.getElementById('analyticsBody').innerHTML = '<div style="color:var(--text3);font-size:14px;text-align:center;padding:2rem 0;">No active history found.<br>Check off some tasks to see your insights!</div>';
    return;
  }
  
  // Calculate sprint progress
  const firstDate = new Date(dates[0]);
  const today = new Date(getLocalISODate());
  const diffTime = Math.abs(today - firstDate);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  const sprintDay = Math.min(diffDays, 60);

  let totalTasksEver = 0;
  let totalTasksDoneEver = 0;
  let catStats = {};

  TASKS.forEach(t => {
    if(!catStats[t.cat]) catStats[t.cat] = { done: 0, total: 0, color: t.dot };
  });

  dates.forEach(d => {
    const dayData = history[d] || {};
    TASKS.forEach((t, i) => {
      // Exclude 'rest' from accuracy math if preferred? Let's include everything for true discipline 
      totalTasksEver++;
      catStats[t.cat].total++;
      if (dayData[i]) {
        totalTasksDoneEver++;
        catStats[t.cat].done++;
      }
    });
  });

  const overallPct = Math.round((totalTasksDoneEver / totalTasksEver) * 100) || 0;

  let html = `
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom: 24px;">
      <div class="stat-card">
        <div class="stat-card-title">Sprint Day</div>
        <div class="stat-val">${sprintDay}<span style="font-size:14px;color:var(--text3);font-weight:600;"> / 60</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Overall Accuracy</div>
        <div class="stat-val">${overallPct}%</div>
      </div>
    </div>
    <div class="stat-card-title" style="margin-left:4px;">Consistency by Category</div>
  `;

  // Sort categories by performance
  const cats = Object.keys(catStats).filter(c => catStats[c].total > 0).sort((a,b) => {
    return (catStats[b].done/catStats[b].total) - (catStats[a].done/catStats[a].total);
  });

  cats.forEach(c => {
    const s = catStats[c];
    const pct = Math.round((s.done / s.total) * 100);
    html += `
      <div class="cat-row">
        <span style="text-transform:capitalize;">${c}</span>
        <span>${pct}%</span>
      </div>
      <div class="cat-bar-wrap">
        <div class="cat-bar-fill" style="width:${pct}%; background:${s.color}"></div>
      </div>
    `;
  });

  document.getElementById('analyticsBody').innerHTML = html;
}

// Boot up
initDate();
</script>
</body>
</html>
