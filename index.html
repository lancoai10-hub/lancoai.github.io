<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My 60-Day Daily Schedule</title>
<style>
  :root {
    --bg:     #080d1a;
    --bg2:    #0f1729;
    --bg3:    #162035;
    --bg4:    #1c2a42;
    --border: #1e3456;
    --border2:#2a4870;
    --text:   #dce8f5;
    --text2:  #7a99be;
    --text3:  #3d5878;
    --accent: #2e86de;
    --green:  #1a9e6e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 1.25rem 1rem 4rem;
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg2);
    border-radius: 18px;
    padding: 1.75rem 1.25rem 2.5rem;
    border: 1px solid var(--border);
  }

  .header { margin-bottom: 1.5rem; }
  .page-icon { font-size: 34px; margin-bottom: 10px; display: block; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; line-height: 1.2; }
  .page-sub { font-size: 12px; color: var(--text3); margin-top: 5px; line-height: 1.5; }

  .progress-wrap { margin-bottom: 1.25rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 7px; }
  .prog-bar { height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.35s ease; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 1.5rem;
  }
  .sc { background: var(--bg3); border-radius: 10px; padding: 10px; border: 1px solid var(--border); }
  .sc-l { font-size: 9px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .sc-v { font-size: 15px; font-weight: 600; color: var(--text); }

  .section-head {
    font-size: 10px; font-weight: 600; color: var(--text3);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin: 1.25rem 0 7px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .row {
    display: flex;
    align-items: center;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg3);
    margin-bottom: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    -webkit-tap-highlight-color: transparent;
    min-height: 54px;
  }
  .row:hover { background: var(--bg4); border-color: var(--border2); }
  .row:active { opacity: 0.75; }
  .row.done { opacity: 0.32; }
  .row.done .row-title { text-decoration: line-through; color: var(--text3); }

  .row-cb {
    width: 46px; min-width: 46px;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border);
    align-self: stretch;
  }
  .row-cb-inner {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    background: transparent;
  }
  .row.done .row-cb-inner { background: var(--green); border-color: var(--green); }
  .row.done .row-cb-inner svg { opacity: 1; }
  .row-cb-inner svg { width: 10px; height: 10px; stroke: #fff; fill: none; stroke-width: 2.5; opacity: 0; }

  .row-dot { width: 7px; height: 7px; border-radius: 50%; min-width: 7px; margin: 0 10px; flex-shrink: 0; }

  .row-main { flex: 1; padding: 11px 6px 11px 0; min-width: 0; }
  .row-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
  .row-time { font-size: 11px; color: var(--text3); }

  .row-end { display: flex; align-items: center; padding-right: 10px; flex-shrink: 0; }
  .row-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; }

  .bottom-bar { margin-top: 2rem; display: flex; justify-content: center; }
  .reset-btn {
    font-size: 13px;
    padding: 13px 28px;
    border-radius: 12px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    max-width: 280px;
    letter-spacing: 0.02em;
  }
  .reset-btn:hover { background: var(--bg4); color: var(--text); }
  .reset-btn:active { opacity: 0.7; }

  .footer { font-size: 11px; color: var(--text3); text-align: center; margin-top: 1.25rem; line-height: 1.7; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Tablet */
  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* iPhone 14 Pro Max = 430px, and smaller phones */
  @media (max-width: 480px) {
    body { padding: 0 0 5rem; }
    .page {
      border-radius: 0;
      border-left: none;
      border-right: none;
      padding: 1.25rem 0.9rem 2rem;
      min-height: 100vh;
    }
    .page-title { font-size: 19px; }
    .page-sub { font-size: 11px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 1.25rem; }
    .sc { padding: 9px 10px; }
    .sc-v { font-size: 14px; }
    .row { min-height: 56px; border-radius: 8px; }
    .row-cb { width: 48px; min-width: 48px; }
    .row-title { font-size: 13px; }
    .row-time { font-size: 10px; }
    .row-tag { display: none; }
    .reset-btn { max-width: 100%; font-size: 14px; padding: 14px; }
  }

  @media (max-width: 380px) {
    .page { padding: 1rem 0.75rem 1.75rem; }
    .page-title { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <span class="page-icon">🌙</span>
    <div class="page-title">My 60-day daily schedule</div>
    <div class="page-sub">5:00 AM — 11:00 PM &nbsp;·&nbsp; Dubai &nbsp;·&nbsp; 2-month sprint</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="pLabel">0 of 20 tasks done</span>
      <span id="pPct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="taskList"></div>

  <div class="bottom-bar">
    <button class="reset-btn" onclick="resetAll()">↺ &nbsp; Reset all tasks</button>
  </div>

  <div class="footer">Open every morning &nbsp;·&nbsp; Check off as you go<br>Your 60-day sprint — every morning counts</div>
</div>

<script>
const TASKS = [
  {time:"5:00",end:"5:45",title:"Wake up, walk & shower",cat:"body",dot:"#1D9E75",bg:"rgba(29,158,117,0.15)",tc:"#5DCAA5",section:"Morning ritual"},
  {time:"5:45",end:"6:45",title:"English speaking practice",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Morning ritual"},
  {time:"6:45",end:"7:30",title:"Breakfast + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Morning ritual"},
  {time:"7:30",end:"8:30",title:"Cybersecurity skills",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"8:30",end:"9:30",title:"Reading book",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Deep work AM"},
  {time:"9:30",end:"10:30",title:"Job applications",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"10:30",end:"11:30",title:"Interview speech practice",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Deep work AM"},
  {time:"11:30",end:"13:00",title:"Lunch + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Midday reset"},
  {time:"13:00",end:"14:00",title:"YouTube channel planning",cat:"create",dot:"#D85A30",bg:"rgba(216,90,48,0.15)",tc:"#F0997B",section:"Afternoon focus"},
  {time:"14:00",end:"15:00",title:"German basics",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Afternoon focus"},
  {time:"15:00",end:"15:30",title:"Rest & nap",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Afternoon focus"},
  {time:"15:30",end:"16:30",title:"Cybersecurity practice",cat:"career",dot:"#2e86de",bg:"rgba(46,134,222,0.15)",tc:"#85B7EB",section:"Afternoon focus"},
  {time:"16:30",end:"17:30",title:"English writing + reading",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Afternoon focus"},
  {time:"17:30",end:"18:30",title:"Free time + errands",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
  {time:"18:30",end:"19:30",title:"Self-motivation + journaling",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Evening wind-down"},
  {time:"19:30",end:"20:30",title:"Dinner + rest",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
  {time:"20:30",end:"21:30",title:"German or English review",cat:"language",dot:"#7F77DD",bg:"rgba(127,119,221,0.15)",tc:"#AFA9EC",section:"Evening wind-down"},
  {time:"21:30",end:"22:30",title:"Evening review + next day plan",cat:"mind",dot:"#EF9F27",bg:"rgba(239,159,39,0.15)",tc:"#FAC775",section:"Evening wind-down"},
  {time:"22:30",end:"22:45",title:"Pray + meditation (15 min)",cat:"spirit",dot:"#1D9E75",bg:"rgba(29,158,117,0.15)",tc:"#5DCAA5",section:"Evening wind-down"},
  {time:"22:45",end:"23:00",title:"Wind down — no screens",cat:"rest",dot:"#3d5878",bg:"rgba(77,106,138,0.12)",tc:"#7a99be",section:"Evening wind-down"},
];

let done = JSON.parse(localStorage.getItem('sched_v3')||'{}');

function getSections(){
  const s=[];
  TASKS.forEach((t,i)=>{if(i===0||t.section!==TASKS[i-1].section)s.push({name:t.section,start:i});});
  return s;
}

function render(){
  const dc=Object.values(done).filter(Boolean).length;
  const pct=Math.round((dc/TASKS.length)*100);
  document.getElementById('pLabel').textContent=dc+' of '+TASKS.length+' tasks done';
  document.getElementById('pPct').textContent=pct+'%';
  document.getElementById('pFill').style.width=pct+'%';

  document.getElementById('stats').innerHTML=[
    {l:'Wake up',v:'5:00 AM'},
    {l:'Sleep',v:'11:00 PM'},
    {l:'Active',v:TASKS.filter(t=>t.cat!=='rest').length+' tasks'},
    {l:'Done today',v:dc},
  ].map(s=>`<div class="sc"><div class="sc-l">${s.l}</div><div class="sc-v">${s.v}</div></div>`).join('');

  const secs=getSections();
  let html='';
  secs.forEach(sec=>{
    html+=`<div class="section-head">${sec.name}</div>`;
    TASKS.forEach((t,i)=>{
      const myS=[...secs].reverse().find(s=>s.start<=i);
      if(!myS||myS.name!==sec.name)return;
      const isDone=done[i];
      html+=`<div class="row${isDone?' done':''}" onclick="tog(${i})">
        <div class="row-cb"><div class="row-cb-inner"><svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></div></div>
        <div class="row-dot" style="background:${t.dot}"></div>
        <div class="row-main">
          <div class="row-title">${t.title}</div>
          <div class="row-time">${t.time} – ${t.end}</div>
        </div>
        <div class="row-end">
          <span class="row-tag" style="background:${t.bg};color:${t.tc};border:1px solid ${t.dot}55">${t.cat}</span>
        </div>
      </div>`;
    });
  });
  document.getElementById('taskList').innerHTML=html;
}

function tog(i){
  done[i]=!done[i];
  localStorage.setItem('sched_v3',JSON.stringify(done));
  render();
}

function resetAll(){
  if(confirm('Reset all checkboxes for a fresh day?')){
    done={};
    localStorage.removeItem('sched_v3');
    render();
  }
}

render();
</script>
</body>
</html>
